name: Build 3105

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build 3105
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Show project information
        run: |
          xcodebuild -project ThreeOneOSFive.xcodeproj -list

      - name: Build unsigned IPA
        run: |
          set -e

          rm -rf build
          mkdir -p build/Payload

          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -n 1)"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app tidak ditemukan."
            exit 1
          fi

          echo "Found app: $APP_PATH"
          cp -R "$APP_PATH" build/Payload/

          cd build
          zip -qry 3105-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned-ipa
          path: build/3105-unsigned.ipa
          if-no-files-found: error
