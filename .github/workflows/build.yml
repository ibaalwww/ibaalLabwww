name: Build 3105 Signed IPA

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
name: Build & Sign 3105
runs-on: macos-15

env:
  PROJECT: ThreeOneOSFive.xcodeproj
  SCHEME: 3105
  CONFIGURATION: Release
  BUNDLE_ID: com.apple.mobile.MobileHouseArrest
steps:
  - name: Checkout
    uses: actions/checkout@v4
  - name: Select Xcode
    run: |
      sudo xcode-select -s /Applications/Xcode_16.4.app
      xcodebuild -version
  - name: Import signing certificate
    env:
      CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
    run: |
      CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
      KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
      echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
      security create-keychain \
        -p "$KEYCHAIN_PASSWORD" \
        "$KEYCHAIN_PATH"
      security set-keychain-settings \
        -lut 21600 \
        "$KEYCHAIN_PATH"
      security unlock-keychain \
        -p "$KEYCHAIN_PASSWORD" \
        "$KEYCHAIN_PATH"
      security import "$CERTIFICATE_PATH" \
        -P "$CERTIFICATE_PASSWORD" \
        -A \
        -t cert \
        -f pkcs12 \
        "$KEYCHAIN_PATH"
      security list-keychain \
        -d user \
        -s "$KEYCHAIN_PATH"
      security default-keychain \
        -s "$KEYCHAIN_PATH"
  - name: Install provisioning profile
    env:
      PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
    run: |
      PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
      echo "$PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
      mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
      cp "$PROFILE_PATH" \
        "$HOME/Library/MobileDevice/Provisioning Profiles/"
  - name: Read provisioning profile
    run: |
      security cms -D \
        -i "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision" \
        > "$RUNNER_TEMP/profile.plist"
      /usr/libexec/PlistBuddy \
        -c "Print:Name" \
        "$RUNNER_TEMP/profile.plist"
      /usr/libexec/PlistBuddy \
        -c "Print:UUID" \
        "$RUNNER_TEMP/profile.plist"
      /usr/libexec/PlistBuddy \
        -c "Print:Entitlements:application-identifier" \
        "$RUNNER_TEMP/profile.plist"
  - name: Resolve dependencies
    run: |
      xcodebuild \
        -project "$PROJECT" \
        -scheme "$SCHEME" \
        -resolvePackageDependencies
  - name: Clean
    run: |
      xcodebuild \
        -project "$PROJECT" \
        -scheme "$SCHEME" \
        -configuration "$CONFIGURATION" \
        clean
  - name: Archive
    run: |
      xcodebuild \
        -project "$PROJECT" \
        -scheme "$SCHEME" \
        -configuration "$CONFIGURATION" \
        -sdk iphoneos \
        -destination "generic/platform=iOS" \
        -archivePath "$RUNNER_TEMP/3105.xcarchive" \
        DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
        PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
        CODE_SIGN_STYLE=Manual \
        CODE_SIGNING_ALLOWED=YES \
        archive
  - name: Create ExportOptions.plist
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      PROFILE_NAME: ${{ secrets.IOS_PROVISION_PROFILE_NAME }}
      EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
    run: |
      cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
      <?xml version="1.0" encoding="UTF-8"?>
      <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
      "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
      <plist version="1.0">
      <dict>
          <key>method</key>
          <string>${EXPORT_METHOD:-development}</string>
          <key>teamID</key>
          <string>${TEAM_ID}</string>
          <key>signingStyle</key>
          <string>manual</string>
          <key>provisioningProfiles</key>
          <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
          </dict>
          <key>stripSwiftSymbols</key>
          <true/>
          <key>compileBitcode</key>
          <false/>
          <key>destination</key>
          <string>export</string>
      </dict>
      </plist>
      EOF
  - name: Export IPA
    run: |
      rm -rf "$RUNNER_TEMP/export"
      xcodebuild \
        -exportArchive \
        -archivePath "$RUNNER_TEMP/3105.xcarchive" \
        -exportPath "$RUNNER_TEMP/export" \
        -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
  - name: Rename IPA
    run: |
      mkdir -p build
      IPA=$(find "$RUNNER_TEMP/export" \
        -maxdepth 1 \
        -type f \
        -name "*.ipa" \
        | head -n 1)
      if [ -z "$IPA" ]; then
        echo "ERROR: IPA tidak ditemukan"
        exit 1
      fi
      cp "$IPA" "build/3105-signed.ipa"
      ls -lh build/3105-signed.ipa
  - name: Upload signed IPA
    uses: actions/upload-artifact@v4
    with:
      name: 3105-signed-ipa
      path: build/3105-signed.ipa
      if-no-files-found: error
      retention-days: 30
  - name: Upload archive
    uses: actions/upload-artifact@v4
    with:
      name: 3105-xcarchive
      path: ${{ runner.temp }}/3105.xcarchive
      retention-days: 7
  - name: Cleanup keychain
    if: always()
    run: |
      security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
