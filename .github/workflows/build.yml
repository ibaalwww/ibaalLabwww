name: Build 3105

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
name: Build 3105
runs-on: macos-15

steps:
  - name: Checkout
    uses: actions/checkout@v4
  - name: Check Xcode
    run: |
      xcodebuild -version
      xcode-select -p
  - name: List project
    run: |
      xcodebuild -project ThreeOneOSFive.xcodeproj -list
